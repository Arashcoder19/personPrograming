<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>دفتر من</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Markazi+Text:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f5f4;--pn:#ffffff;--pn2:#e7efed;--tx:#13201f;--mut:#566664;--bd:#d0dbd8;--ac:#0b7a7c;--on-ac:#ffffff;--bad:#b3322d;--good:#2b7a4b;--warn:#a05f00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1819;--pn:#152527;--pn2:#1c3134;--tx:#e5eeed;--mut:#9bb0ae;--bd:#2c4346;--ac:#4cc2bf;--on-ac:#06292a;--bad:#f08a84;--good:#6fd39a;--warn:#e8b24a}}
:root[data-theme="dark"]{--bg:#0d1819;--pn:#152527;--pn2:#1c3134;--tx:#e5eeed;--mut:#9bb0ae;--bd:#2c4346;--ac:#4cc2bf;--on-ac:#06292a;--bad:#f08a84;--good:#6fd39a;--warn:#e8b24a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.8 Vazirmatn,Tahoma,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.brand{font:700 30px/1 'Markazi Text',Vazirmatn,serif;color:var(--ac)}
#nav{display:flex;gap:2px;overflow-x:auto;padding:0 8px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.nb{padding:10px 13px;border:0;background:none;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nb[aria-current="page"]{color:var(--tx);font-weight:700;border-color:var(--ac)}
.nb:hover{color:var(--tx)}
#main{padding:16px 14px 40px;max-width:1040px;margin:0 auto;width:100%;min-width:0}
@media (min-width:900px){
 #shell{display:grid;grid-template-columns:190px minmax(0,1fr);align-items:start}
 #top{grid-column:1/-1}
 #nav{flex-direction:column;overflow:visible;border-bottom:0;border-inline-end:1px solid var(--bd);top:calc(env(safe-area-inset-top,0px) + 8px);padding:0 10px 0 8px;height:fit-content;margin-inline-start:8px}
 .nb{text-align:start;border-bottom:0;border-inline-start:3px solid transparent;border-radius:6px;padding:9px 12px}
 .nb[aria-current="page"]{border-inline-start-color:var(--ac);background:var(--pn2)}
}
.h1{font:700 32px/1.25 'Markazi Text',Vazirmatn,serif;margin:2px 0 6px}
.h2{font-size:16px;font-weight:700;margin-bottom:8px}
.mut{color:var(--mut);font-size:13px}
.late{color:var(--bad);font-weight:700}.ok{color:var(--good)}
.f1{flex:1 1 140px;min-width:0}.f2{flex:2 1 200px;min-width:0}
.mt{margin-top:10px}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.pn2{background:var(--pn2);border-radius:8px;padding:10px 12px;margin:10px 0}
details.pn>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
details.pn[open]>summary{margin-bottom:10px}
details.mini{margin-top:4px}details.mini>summary{cursor:pointer;color:var(--mut);font-size:13px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fl>select{flex:0 1 135px}.fl>.dtw{flex:0 1 150px}
.fld{display:block;min-width:0}.fld>span{display:block;font-size:13px;color:var(--mut)}
.in{width:100%;min-width:0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:7px 10px;line-height:1.5}
textarea.in{resize:vertical}
.in::placeholder{color:var(--mut);opacity:.85}
.in[aria-invalid="true"]{border-color:var(--bad)}
:where(button,a,input,select,textarea,summary):focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{display:inline-block;border:1px solid var(--bd);background:var(--pn);border-radius:8px;padding:6px 13px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.5;transition:border-color .15s}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.btn.dng{color:var(--bad)}.btn.dng.arm{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.btn.sm{padding:2px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;font-size:12px;padding:0 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{border:1px solid var(--bd);background:var(--pn);border-radius:99px;padding:3px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--ac);margin:4px 0 0}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}.bar i.over{background:var(--bad)}
.row{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 6px 10px 2px;border-bottom:1px solid var(--bd);border-inline-start:4px solid transparent;padding-inline-start:10px}
.row:last-child{border-bottom:0}
.p-high{border-inline-start-color:var(--bad)}.p-mid{border-inline-start-color:var(--warn)}.p-low{border-inline-start-color:var(--good)}
.tx-in{border-inline-start-color:var(--good)}.tx-out{border-inline-start-color:var(--bad)}
.rb{min-width:0;display:grid;gap:6px}
.done .tt{text-decoration:line-through;opacity:.6}
.dtw{min-width:0}.dtw .jd{display:block;line-height:1.3}
.tile{display:block;width:100%;text-align:start;background:var(--pn);border:1px solid var(--bd);border-inline-start:4px solid var(--ac);border-radius:6px 10px 10px 6px;padding:10px 12px;cursor:pointer}
div.tile{cursor:default}
.tile .v{font-size:21px;font-weight:700;line-height:1.5}
.tile.neg{border-inline-start-color:var(--bad)}.tile.pos{border-inline-start-color:var(--good)}
.hero{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;margin-bottom:16px}
.hero .h1{font-size:44px;margin:0}
.hero .hp{flex:1 1 240px}
.empty{color:var(--mut);padding:18px 8px;text-align:center}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--bd);background:none;cursor:pointer;font-size:11px;color:var(--mut);padding:0}
.dot[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.dot.t{border-color:var(--tx)}
.moods{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.mood{border:1px solid var(--bd);background:var(--pn);border-radius:10px;padding:4px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.mood[aria-pressed="true"]{border-color:var(--ac);background:var(--pn2);font-weight:700}
.spark{display:flex;align-items:flex-end;gap:4px;height:84px;margin-top:6px}
.spark>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:10px;color:var(--mut)}
.spark i{display:block;width:100%;max-width:22px;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.trend{display:flex;gap:12px;align-items:flex-end;margin-top:6px}
.trend>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mut)}
.trend .pair{display:flex;align-items:flex-end;gap:3px;height:84px}
.trend .pair i{display:block;width:13px;border-radius:3px 3px 0 0;min-height:2px}
.i-in{background:var(--good)}.i-out{background:var(--bad)}
.catrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:3px 0;font-size:14px}
@media (max-width:560px){.catrow{grid-template-columns:90px 1fr}.catrow .mut{grid-column:1/-1;margin-top:-6px}}
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.ov.on{display:flex}
.md{width:100%;max-width:560px;max-height:92vh;overflow:auto;margin:0}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;max-width:440px;margin-inline:auto;z-index:80;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:none}
@media (max-width:640px){.in{font-size:16px}}
@media (pointer:coarse){.btn{padding:10px 14px;min-height:44px}.btn.sm{min-height:36px}.in{min-height:44px}.nb{min-height:44px}.chip{padding:8px 16px}input[type=checkbox]{width:24px;height:24px}.dot{width:36px;height:36px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Responsive layout improvements: phones, tablets, laptops and wide screens */
html{width:100%;min-width:0;overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{width:100%;min-width:0;overflow-x:clip}
#shell{width:100%;min-width:0}
#top,#nav,#main{min-width:0;max-width:100%}
#top{padding-inline:clamp(10px,2.5vw,22px)}
#main{padding-inline:clamp(10px,2.5vw,22px)}
#nav{overscroll-behavior-inline:contain;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
#nav .nb{flex:0 0 auto}
.grid,.pn,.pn2,.hero,.fl,.row,.rb,.tile{min-width:0}
.grid>*{min-width:0}
img,svg,video,canvas,iframe{max-width:100%}
pre,code{max-width:100%;overflow-wrap:anywhere;white-space:pre-wrap}
input,select,textarea,button{max-width:100%}
textarea{overflow-wrap:anywhere}
button,.btn,.chip,.mood{touch-action:manipulation}
.ov{padding:clamp(8px,2vw,20px);padding-bottom:calc(clamp(8px,2vw,20px) + env(safe-area-inset-bottom,0px))}
.md{max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
@media (max-width:899px){
 #shell{display:flex;flex-direction:column}
 #top{gap:8px;padding-block:12px}
 .brand{font-size:28px}
 #nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-direction:row;align-items:stretch;overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:0 8px;border-bottom:1px solid var(--bd);border-inline-end:0;margin:0;gap:2px;scroll-snap-type:inline proximity;-webkit-overflow-scrolling:touch}
 #nav .nb{scroll-snap-align:start;padding:9px 12px;border:0;border-bottom:3px solid transparent;border-radius:0;flex:0 0 auto}
 #nav .nb[aria-current="page"]{border-bottom-color:var(--ac);border-inline-start-color:transparent;background:transparent}
 #main{padding-top:14px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
 .h1{font-size:clamp(25px,5vw,32px)}
 .hero .h1{font-size:clamp(32px,7vw,44px)}
}
@media (max-width:640px){
 body{font-size:14px;line-height:1.75}
 #top{align-items:center}
 #top .f1{display:none}
 #main{padding-inline:10px}
 .pn{padding:10px;margin-bottom:8px;border-radius:9px}
 .pn2{padding:9px}
 .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
 .fl{align-items:stretch}
 .fl>select,.fl>.dtw{flex:1 1 130px;min-width:0}
 .fl>.btn{flex:0 1 auto}
 .fld{width:100%;min-width:0}
 .hero{gap:8px;margin-bottom:12px}
 .hero .hp{flex-basis:100%}
 .row{grid-template-columns:auto minmax(0,1fr);gap:7px;padding-inline:2px 4px}
 .catrow{grid-template-columns:minmax(70px,auto) minmax(0,1fr);gap:6px}
 .catrow>*{min-width:0;overflow-wrap:anywhere}
 .tile .v{font-size:19px;overflow-wrap:anywhere}
 .btn{white-space:normal;overflow-wrap:anywhere}
 .dots{gap:4px}
 .dot{width:30px;height:30px}
 .spark,.trend{max-width:100%;overflow:hidden}
 .ov{align-items:flex-end;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
 .md{max-width:none;max-height:calc(100dvh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:12px 12px 8px 8px}
}
@media (max-width:380px){
 .brand{font-size:25px}
 #nav .nb{padding-inline:9px;font-size:13px}
 .h2{font-size:15px}
 .fl{gap:6px}
 .fl>.btn{flex:1 1 auto}
 .row{grid-template-columns:1fr}
 .row> :first-child{justify-self:start}
 .catrow{grid-template-columns:minmax(0,1fr)}
 .catrow .mut{grid-column:auto;margin-top:0}
}
@media (min-width:900px) and (max-width:1100px){
 #shell{grid-template-columns:165px minmax(0,1fr)}
 #main{padding-inline:12px}
}
@media (min-width:1400px){
 #main{max-width:1180px}
}
@media (prefers-reduced-motion:reduce){#nav{scroll-behavior:auto}}

</style>
</head>
<body>
<div id="shell">
<header id="top">
  <span class="brand">دفتر من</span><span id="sync" class="mut" role="status"></span><span class="f1"></span>
  <button class="btn sm" data-act="theme" aria-label="تغییر پوسته (خودکار، روشن، تیره)">◐ پوسته</button>
  <button class="btn sm" data-act="bkopen">پشتیبان‌گیری</button>
</header>
<nav id="nav" aria-label="بخش‌های برنامه"></nav>
<main id="main" tabindex="-1"></main>
</div>
<div id="ov" class="ov" role="dialog" aria-modal="true" aria-label="پشتیبان‌گیری و بازیابی">
 <div class="pn md">
  <h2 class="h2">پشتیبان‌گیری و بازیابی</h2>
  <p class="mut" id="bk-m">این متن همهٔ داده‌های شماست. کپی یا ذخیره‌اش کنید تا نسخهٔ پشتیبان داشته باشید. برای بازیابی، متن پشتیبان را اینجا بچسبانید یا فایل را انتخاب کنید.</p>
  <textarea id="bk-t" class="in mt" rows="10" dir="ltr" spellcheck="false" aria-label="متن JSON داده‌ها"></textarea>
  <div class="fl mt">
    <button class="btn" data-act="bkcopy">کپی متن</button>
    <button class="btn" id="bk-dl" data-act="bkdl" hidden>ذخیرهٔ فایل</button>
    <label class="btn">انتخاب فایل<input id="bk-f" type="file" accept=".json,application/json" hidden></label>
    <button class="btn pri" data-act="bkload">جایگزینی با این متن</button>
    <span class="f1"></span><button class="btn" data-act="bkclose">بستن</button>
  </div>
 </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* ================= ابزارها ================= */
const LSK='dafar-v1',TK='dafar-theme';
const NAMES=['proj','task','tx','buy','goal','idea','book','rlog','work','skill','sprac','habit','jour','sess'];
const blank=()=>{const d={set:{budgets:{}}};NAMES.forEach(n=>d[n]=[]);return d};
let D=blank();
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const rid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),FAD='۰۱۲۳۴۵۶۷۸۹';
const fa=x=>String(x).replace(/\d/g,d=>FAD[d]);
const num=s=>{const v=Number(String(s??'').replace(/[۰-۹]/g,c=>FAD.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[,٬،\s]/g,'').replace(/٫/g,'.'));return isFinite(v)?v:0};
const fmt=n=>Math.round(n||0).toLocaleString('fa-IR');
const vN=v=>v===''||v==null?'':fmt(v);
const sum=(a,k)=>a.reduce((s,x)=>s+num(x[k]),0);
const fh=m=>fa((m/60).toFixed(1)).replace('.','٫');
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const g2j=(gy,gm,gd)=>{const g=[0,31,59,90,120,151,181,212,243,273,304,334],y2=gm>2?gy+1:gy;let d=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+g[gm-1],jy=-1595+33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365}const jm=d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),jdd=1+(d<186?d%31:(d-186)%30);return jy+'/'+pad(jm)+'/'+pad(jdd)};
const jstr=d=>g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
const today=()=>jstr(new Date());
const add=n=>{const d=new Date();d.setDate(d.getDate()+n);return jstr(d)};
const lastDays=n=>Array.from({length:n},(_,i)=>add(-(n-1-i)));
const nd=s=>{s=String(s??'').trim().replace(/[۰-۹]/g,c=>FAD.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));if(!s)return'';const m=s.match(/^(\d{4})\D(\d{1,2})\D(\d{1,2})$/);if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>(mo<=6?31:30))return null;return y+'/'+pad(mo)+'/'+pad(d)};
const jd=s=>{const m=nd(s);if(!m)return'';const[y,mo,d]=m.split('/').map(Number);return fa(d)+' '+MN[mo-1]+' '+fa(y)};
const ymNow=()=>{const[y,m]=today().split('/').map(Number);return{y,m}};
const ymStr=o=>o.y+'/'+pad(o.m);
const ymAdd=(o,n)=>{const t=o.y*12+(o.m-1)+n;return{y:Math.floor(t/12),m:t%12+1}};
const ymLabel=o=>MN[o.m-1]+' '+fa(o.y);
const urlOf=l=>{l=(l||'').trim();if(!l)return'';if(/^https?:\/\//i.test(l))return l;if(/^[a-z][a-z0-9+.-]*:/i.test(l))return'';return'https://'+l};
const streak=h=>{const S=new Set(h.log||[]);let n=0,i=S.has(today())?0:1;while(i<4000&&S.has(add(-i))){n++;i++}return n};

/* ================= برچسب‌ها ================= */
const AREA={work:'کاری',personal:'شخصی',home:'خانه',study:'یادگیری'};
const PR={low:'کم',mid:'متوسط',high:'زیاد'};
const TS={todo:'انجام نشده',doing:'در حال انجام',done:'انجام شد'};
const PS={plan:'برنامه‌ریزی',doing:'در حال انجام',hold:'متوقف',done:'تمام‌شده'};
const GCAT={personal:'فردی',career:'شغلی',finance:'مالی',health:'سلامت و ورزش',learning:'یادگیری',relation:'روابط',other:'سایر'};
const GH={short:'کوتاه‌مدت',mid:'میان‌مدت',long:'بلندمدت'};
const GST={active:'فعال',done:'محقق شد',hold:'متوقف',dropped:'رها شد'};
const IT={idea:'ایده',plan:'طرح'};
const IST={new:'جدید',review:'در حال بررسی',approved:'تصویب‌شده',doing:'در حال اجرا',done:'انجام‌شده',hold:'متوقف',rejected:'ردشده'};
const BKIND={need:'ضروری',want:'دلخواه',daily:'روزمره'};
const BST={want:'می‌خواهم',plan:'برنامه‌ریزی‌شده',bought:'خریده شد',drop:'منصرف شدم'};
const BKS={want:'در فهرست',reading:'در حال مطالعه',done:'تمام شد',pause:'متوقف'};
const INT={1:'سبک',2:'متوسط',3:'سنگین'};
const MOOD={1:'خیلی بد',2:'بد',3:'معمولی',4:'خوب',5:'عالی'},EMO=['😞','😕','😐','🙂','😄'];

function setStatus(s){const e=$('#sync');if(!e)return;e.textContent=s==='cloud'?'ذخیره شد در حساب شما':s==='saving'?'در حال ذخیره…':s==='err'?'ذخیره در حساب انجام نشد؛ دوباره تلاش می‌شود':'فقط در همین مرورگر ذخیره می‌شود';e.title=s==='local'?'برای نگهداری دائمی از دکمهٔ پشتیبان‌گیری استفاده کنید.':''}
function lsSave(){try{localStorage.setItem(LSK,JSON.stringify(D))}catch(e){if(Date.now()-warned>20000){warned=Date.now();toast('ذخیره در مرورگر انجام نشد. از پشتیبان‌گیری استفاده کنید.')}}}
function touch(){for(const c of arguments)dirty.add(c);if(!loadedRemote)editedEarly=true;clearTimeout(saveT);saveT=setTimeout(()=>{lsSave();persist()},500)}
function flush(){if(saveT){clearTimeout(saveT);saveT=0;lsSave()}}
function chunks(items){const out=[];let cur=[],sz=0;for(const it of items){const s=enc.encode(JSON.stringify(it)).length+1;if(cur.length&&sz+s>150000){out.push(cur);cur=[];sz=0}cur.push(it);sz+=s}out.push(cur);return out}
const dref=id=>cloud.doc('data/users/'+uid+'/'+id);
async function put(id,body){const s=JSON.stringify(body);if(saved[id]===s)return;await dref(id).set(body);saved[id]=s}
async function persist(){
 if(!cloud||saving||!dirty.size||!loadedRemote)return;saving=true;setStatus('saving');let c=null;
 try{
  while(dirty.size){
   c=[...dirty][0];dirty.delete(c);
   if(c==='set'){await put('c-set-0',{name:'set',n:0,data:D.set});continue}
   const ch=chunks(D[c]);
   for(let i=0;i<ch.length;i++){if(i===0&&!ch[0].length&&!saved['c-'+c+'-0'])continue;await put('c-'+c+'-'+i,{name:c,n:i,items:ch[i]})}
   for(const id of Object.keys(saved)){const m=id.match(/^c-([a-z]+)-(\d+)$/);if(m&&m[1]===c&&+m[2]>=ch.length){await dref(id).delete();delete saved[id]}}
  }
  setStatus('cloud');
 }catch(e){if(c)dirty.add(c);setStatus('err');clearTimeout(retryT);retryT=setTimeout(persist,15000)}
 saving=false;if(dirty.size&&!retryT)persist();
}
function fixD(){
 D.set=D.set&&typeof D.set==='object'?D.set:{};D.set.budgets=D.set.budgets&&typeof D.set.budgets==='object'?D.set.budgets:{};
 NAMES.forEach(n=>{D[n]=(Array.isArray(D[n])?D[n]:[]).filter(x=>x&&typeof x==='object');D[n].forEach(x=>{if(!x.id)x.id=rid()})});
 D.goal.forEach(g=>{if(!Array.isArray(g.kr))g.kr=[]});
 D.idea.forEach(e=>{if(!Array.isArray(e.log))e.log=[]});
 D.habit.forEach(h=>{if(!Array.isArray(h.log))h.log=[]});
 D.sess.forEach(s=>{['items','res'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]})});
}
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LSK)||'null');if(s&&typeof s==='object'){const d=blank();NAMES.forEach(n=>{if(Array.isArray(s[n]))d[n]=s[n]});if(s.set&&typeof s.set==='object')d.set=s.set;D=d}}catch(e){}fixD()}
async function loadRemote(){
 const snap=await cloud.collection('data/users/'+uid).get(),g={};
 snap.docs.forEach(d=>{const m=d.id.match(/^c-([a-z]+)-(\d+)$/),b=d.data();if(!m||!b)return;
  saved[d.id]=JSON.stringify(m[1]==='set'?{name:b.name,n:b.n,data:b.data}:{name:b.name,n:b.n,items:b.items});(g[m[1]]=g[m[1]]||[]).push({n:+m[2],b})});
 return g}
function applyRemote(g){
 const nd2=blank();
 for(const k in g){const arr=g[k].sort((a,b)=>a.n-b.n);
  if(k==='set')nd2.set=JSON.parse(JSON.stringify(arr[0].b.data||{}));
  else if(NAMES.includes(k))nd2[k]=arr.flatMap(x=>JSON.parse(JSON.stringify(x.b.items||[])))}
 D=nd2;fixD()}
const hasData=()=>NAMES.some(n=>D[n].length)||Object.keys(D.set.budgets).length>0;
async function initCloud(){
 try{
  const c=window.claude;if(!c||!c.use){return}
  c.use('downloads').then(x=>{if(x){dlApi=x;const b=$('#bk-dl');if(b)b.hidden=false}}).catch(()=>{});
  const[db,user]=await Promise.all([c.use('db'),c.use('user')]);
  if(!db||!user){setStatus('local');return}
  const id=await user.id();if(!id){setStatus('local');return}
  cloud=db;uid=id;
  const g=await loadRemote();
  if(Object.keys(g).length){
   const local=D;applyRemote(g);
   if(editedEarly)NAMES.forEach(c2=>{const ids=new Set(D[c2].map(x=>x.id)),ex=local[c2].filter(x=>!ids.has(x.id));if(ex.length){D[c2]=D[c2].concat(ex);dirty.add(c2)}});
   lsSave();
  }else if(hasData()){NAMES.forEach(n=>dirty.add(n));dirty.add('set')}
  loadedRemote=true;setStatus('cloud');render();persist();
 }catch(e){setStatus('local')}
}

function vSearch(){
 const q=String(F.gq||'').trim().toLocaleLowerCase();
 const defs=[
  ['task','تسک‌ها',D.task,x=>[x.t,x.desc,x.area,x.st]],
  ['proj','پروژه‌ها',D.proj,x=>[x.name,x.desc,x.status]],
  ['fin','تراکنش‌های مالی',D.tx,x=>[x.t,x.cat,x.type,x.d]],
  ['buy','خریدها',D.buy,x=>[x.t,x.note,x.link,x.st]],
  ['goal','اهداف',D.goal,x=>[x.t,x.desc,x.kpi,x.cat]],
  ['idea','ایده‌ها',D.idea,x=>[x.t,x.desc,x.type,x.st]],
  ['grow','کتاب‌ها',D.book,x=>[x.t,x.author,x.note]],
  ['grow','ورزش',D.work,x=>[x.type,x.note,x.d]],
  ['grow','مهارت‌ها',D.skill,x=>[x.name,x.plan,x.res]],
  ['grow','عادت‌ها',D.habit,x=>[x.name]],
  ['grow','یادداشت روزانه',D.jour,x=>[x.txt,x.gr,x.lesson,x.d]],
  ['sess','جلسات تفکر',D.sess,x=>[x.t,x.agenda,x.notes,x.place]],
  ['sess','مصوبه‌های جلسات',D.sess.flatMap(s=>(s.res||[]).map(r=>({...r,sessionTitle:s.t,sessionId:s.id}))),x=>[x.t,x.sessionTitle]]
 ];
 const results=[];
 if(q) for(const [view,label,arr,fields] of defs) for(const x of arr){
  const text=fields(x).filter(Boolean).join(' ').toLocaleLowerCase();
  if(text.includes(q)) results.push({view,label,x,text});
 }
 const shown=results.slice(0,100);
 return `<h1 class="h1">جستجوی کل دفتر</h1>
 <p class="mut" style="margin-bottom:10px">یک‌بار جستجو کنید تا تسک‌ها، پروژه‌ها، مالی، خریدها، اهداف، ایده‌ها و یادداشت‌های رشد فردی را با هم پیدا کنید. نتایج از داده‌های ذخیره‌شدهٔ همان بخش‌ها خوانده می‌شوند؛ نسخهٔ جداگانه‌ای ساخته نمی‌شود.</p>
 <div class="pn"><input class="in" style="width:100%" id="gs-q" data-f="gq" value="${esc(F.gq||'')}" placeholder="جستجو در تمام دفتر…" aria-label="جستجو در تمام دفتر" autofocus>
 ${!q?`<p class="mut mt">برای شروع، یک واژه وارد کنید.</p>`:shown.length?`<p class="mut mt">${fa(results.length)} نتیجه${results.length>100?' (۱۰۰ نتیجهٔ اول نمایش داده می‌شود)':''}</p><div class="mt">${shown.map(r=>`<button class="pn" style="display:block;width:100%;text-align:right;cursor:pointer;margin-bottom:8px" data-act="searchgo" data-v="${r.view}" data-q="${esc(q)}" data-gt="${r.label==='کتاب‌ها'?'read':r.label==='ورزش'?'work':r.label==='مهارت‌ها'?'skill':r.label==='عادت‌ها'?'habit':r.label==='یادداشت روزانه'?'jour':''}" data-i="${esc(r.x.id||r.x.sessionId||'')}"><b>${esc(r.label)}</b><div>${esc(r.x.t||r.x.name||r.x.type||r.x.cat||'بدون عنوان')}</div><small class="mut">${esc([r.x.d,r.x.due,r.x.author,r.x.cat,r.x.sessionTitle].filter(Boolean).join(' · '))}</small></button>`).join('')}</div>`:empty('نتیجه‌ای پیدا نشد.')}</div>`;
}

function render(){
 const m=$('#main');if(!m)return;const ae=document.activeElement,aid=ae&&ae.id&&m.contains(ae)?ae.id:null,ss=aid&&ae.selectionStart!=null?ae.selectionStart:null;
 $$('details[data-oid]',m).forEach(d=>{d.open?open.add(d.dataset.oid):open.delete(d.dataset.oid)});

 m.innerHTML=(VIEWS[V]||vToday)();
 $$('details[data-oid]',m).forEach(d=>{if(open.has(d.dataset.oid))d.open=true});
 window.scrollTo(0,y);
 if(aid){const n=document.getElementById(aid);if(n){n.focus({preventScroll:true});if(ss!=null)try{n.setSelectionRange(ss,ss)}catch(_){}}}

}
function go(v){V=v;F={};render();window.scrollTo(0,0)}

/* ================= ویرایش فیلدها ================= */
function getObj(c,i,p){
 if(c==='kr'){const g=D.goal.find(x=>x.id===p);return g&&g.kr.find(x=>x.id===i)}
 if(c==='ri'){const s=D.sess.find(x=>x.id===p);return s&&s.items.find(x=>x.id===i)}
 if(c==='rs'){const s=D.sess.find(x=>x.id===p);return s&&s.res.find(x=>x.id===i)}
 return D[c]&&D[c].find(x=>x.id===i)}
const ROOT={kr:'goal',ri:'sess',rs:'sess'};
function setTaskSt(t,st){t.st=st;if(st==='done')t.doneAt=today();else delete t.doneAt}
function applyVerdict(it){
 const e=entOf(it);if(!e)return;const v=it.verdict;
 if(it.kind==='goal'){if(v==='approved'&&['hold','dropped'].includes(e.st))e.st='active';else if(v==='rejected'&&e.st==='active')e.st='dropped';touch('goal')}
 else if(it.kind==='idea'){if(v==='approved'&&['new','review','rejected','hold'].includes(e.st))e.st='approved';else if(v==='rejected'&&!['doing','done'].includes(e.st))e.st='rejected';else if((v==='pending'||v==='postponed')&&['approved','rejected'].includes(e.st))e.st='review';touch('idea')}}
function syncBuy(b){
 const tx=b.txid&&D.tx.find(x=>x.id===b.txid);
 if(b.st==='bought'&&num(b.price)>0){
  if(!b.d)b.d=today();
  if(tx){tx.t=b.t;tx.amt=num(b.price);tx.d=b.d}
  else{const x={id:rid(),type:'out',t:b.t,cat:'خرید',amt:num(b.price),d:b.d,pid:'',bid:b.id};D.tx.push(x);b.txid=x.id}
 }else if(tx){D.tx=D.tx.filter(x=>x.id!==tx.id);b.txid='';if(b.st!=='bought')b.d=''}
 touch('buy','tx')}
function fieldEvt(e,commit){
 const el=e.target;if(!el||!el.dataset)return;const ds=el.dataset;
 if(ds.f!==undefined){
  if(el.tagName==='SELECT'&&!commit)return;if(el.tagName==='INPUT'&&el.type!=='checkbox'&&commit)return;
  let v=el.type==='checkbox'?el.checked:el.value;
  if(ds.f==='jd'){const n=nd(v);if(!n)return;v=n}
  F[ds.f]=v;render();return}
 if(ds.sel){if(commit)SEL[ds.sel]&&SEL[ds.sel](el);return}
 if(ds.jour){const d=ds.d;let j=D.jour.find(x=>x.d===d);if(!j){j={id:rid(),d,mood:0,gr:'',lesson:'',txt:''};D.jour.push(j)}j[ds.jour]=el.value;touch('jour');return}
 if(ds.bud!==undefined){if(!commit)return;const v=num(el.value);if(v>0)D.set.budgets[ds.bud]=v;else delete D.set.budgets[ds.bud];touch('set');refreshSums();return}
 const c=ds.c;if(!c)return;
 if(!commit&&(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='range'))return;
 const o=getObj(c,ds.i,ds.p);if(!o)return;const k=ds.k,t=ds.t;
 let v=el.type==='checkbox'?el.checked:el.value;
 if(t==='d'){const n=nd(v);if(n===null){el.setAttribute('aria-invalid','true');return}el.removeAttribute('aria-invalid');v=n;if(commit)el.value=n;const j=el.parentElement&&el.parentElement.querySelector('.jd');if(j)j.textContent=jd(n)}
 if(t==='n')v=num(v);if(t==='p')v=Math.max(0,Math.min(100,num(v)));
 if(c==='task'&&(k==='chk'||k==='st'))setTaskSt(o,k==='chk'?(v?'done':'todo'):v);
 else if(c==='goal'&&k==='st'){o.st=v}
 else if(c==='book'&&k==='st'){o.st=v;if(v==='done'){o.doneAt=today();if(num(o.pages))o.cur=num(o.pages)}else delete o.doneAt}
 else if(c==='work'&&k==='int')o.int=+v;
 else if(c==='book'&&k==='rate')o.rate=+v||0;
 else o[k]=v;
 if(c==='ri'&&k==='verdict')applyVerdict(o);
 if(c==='buy'&&['st','price','d','t'].includes(k))syncBuy(o);
 // تراکنش متصل به خرید، نمای مالی همان خرید است؛ ویرایش از هر دو بخش همگام می‌شود.
 if(c==='tx'&&o.bid){
  const b=D.buy.find(x=>x.id===o.bid);
  if(b){
   if(k==='t')b.t=o.t;
   if(k==='amt')b.price=num(o.amt);
   if(k==='d')b.d=o.d;
   touch('buy');
  }
 }
 touch(ROOT[c]||c);
 if(ds.r)render();else if(commit)refreshSums();
}
document.addEventListener('input',e=>fieldEvt(e,false));
document.addEventListener('change',e=>fieldEvt(e,true));
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#ov').classList.contains('on')){$('#ov').classList.remove('on');return}
 if(e.key==='Enter'&&e.target.dataset){const a=e.target.dataset.enter;if(a&&ACT[a]){e.preventDefault();ACT[a](e.target);return}const g=e.target.dataset.enterKr;if(g){e.preventDefault();ACT.kradd(e.target.closest('.rf').querySelector('[data-act=kradd]'))}}
});

/* ================= حذف ================= */
function removeItem(c,i,p){
 if(c==='proj'){D.proj=D.proj.filter(x=>x.id!==i);['task','tx','goal','idea'].forEach(k=>D[k].forEach(x=>{if(x.pid===i)x.pid=''}));D.sess.forEach(s=>s.items=s.items.filter(it=>!(it.kind==='proj'&&it.ref===i)));touch('proj','task','tx','goal','idea','sess');return}
 if(c==='goal'||c==='idea'){D[c]=D[c].filter(x=>x.id!==i);D.sess.forEach(s=>s.items=s.items.filter(it=>!(it.kind===c&&it.ref===i)));touch(c,'sess');return}
 if(c==='book'){D.book=D.book.filter(x=>x.id!==i);D.rlog=D.rlog.filter(x=>x.bid!==i);touch('book','rlog');return}
 if(c==='skill'){D.skill=D.skill.filter(x=>x.id!==i);D.sprac=D.sprac.filter(x=>x.sid!==i);touch('skill','sprac');return}
 if(c==='buy'){const b=D.buy.find(x=>x.id===i);if(b&&b.txid)D.tx=D.tx.filter(x=>x.id!==b.txid);D.buy=D.buy.filter(x=>x.id!==i);touch('buy','tx');return}
 if(c==='tx'){D.tx=D.tx.filter(x=>x.id!==i);D.buy.forEach(b=>{if(b.txid===i)b.txid=''});touch('tx','buy');return}
 if(c==='task'){D.task=D.task.filter(x=>x.id!==i);D.sess.forEach(s=>s.res.forEach(r=>{if(r.tid===i)r.tid=''}));touch('task','sess');return}
 if(c==='kr'){const g=D.goal.find(x=>x.id===p);if(g)g.kr=g.kr.filter(x=>x.id!==i);touch('goal');return}
 if(c==='log'){const e=D.idea.find(x=>x.id===p);if(e)e.log=e.log.filter(x=>x.id!==i);touch('idea');return}
 if(c==='ri'){const s=D.sess.find(x=>x.id===p);if(s)s.items=s.items.filter(x=>x.id!==i);touch('sess');return}
 if(c==='rs'){const s=D.sess.find(x=>x.id===p);if(s)s.res=s.res.filter(x=>x.id!==i);touch('sess');return}
 if(D[c]){D[c]=D[c].filter(x=>x.id!==i);touch(c)}}

 addgoal:()=>{const t=gv('ng-t');if(!t){focusId('ng-t');return}const d=nd(gv('ng-d'));if(d===null){bad('ng-d');return}

 hadd:()=>{const n=gv('nh-n');if(!n){focusId('nh-n');return}D.habit.push({id:rid(),name:n,log:[],arch:false});touch('habit');render();focusId('nh-n')},
 hdot:b=>{const h=D.habit.find(x=>x.id===b.dataset.i);if(!h)return;const d=b.dataset.d;h.log=h.log.includes(d)?h.log.filter(x=>x!==d):[...h.log,d];touch('habit');render()},
 htoggle:b=>{const h=D.habit.find(x=>x.id===b.dataset.i);if(!h)return;const d=today();h.log=h.log.includes(d)?h.log.filter(x=>x!==d):[...h.log,d];touch('habit');render()},
 harch:b=>{const h=D.habit.find(x=>x.id===b.dataset.i);if(!h)return;h.arch=!h.arch;touch('habit');render()},
 wadd:()=>{const m=num(gv('nw-m'));if(!m){focusId('nw-m');return}const d=nd(gv('nw-d'));if(d===null||d===''){bad('nw-d');return}
  D.work.push({id:rid(),d,type:gv('nw-t'),min:m,int:+gv('nw-i')||2,note:gv('nw-n')});touch('work');render();focusId('nw-m')},
 bookadd:()=>{const t=gv('nk-t');if(!t){focusId('nk-t');return}const b={id:rid(),t,author:gv('nk-a'),pages:num(gv('nk-p'))||'',cur:0,st:'want',rate:0,note:''};D.book.unshift(b);open.add('b-'+b.id);touch('book');render()},
 rlogadd:b=>{const f=rf(b),bk=D.book.find(x=>x.id===b.dataset.i);if(!bk)return;const pg=num(f.querySelector('.rp').value),mn=num(f.querySelector('.rm').value);if(!pg&&!mn){f.querySelector('.rp').focus();return}
  const d=nd(f.querySelector('.rd').value);if(d===null||d===''){toast('تاریخ معتبر نیست؛ نمونه: 1405/01/01');return}
  D.rlog.push({id:rid(),bid:bk.id,d,pages:pg,min:mn});
  if(pg){const tot=num(bk.pages);bk.cur=num(bk.cur)+pg;if(tot&&bk.cur>=tot){bk.cur=tot;bk.st='done';bk.doneAt=d}else if(bk.st==='want'||bk.st==='pause')bk.st='reading'}
  open.add('b-'+bk.id);touch('rlog','book');render()},
 skadd:()=>{const n=gv('nk-n');if(!n){focusId('nk-n');return}const s={id:rid(),name:n,level:0,target:100,plan:'',res:''};D.skill.unshift(s);open.add('k-'+s.id);touch('skill');render()},
 spadd:b=>{const f=rf(b),m=num(f.querySelector('.rm').value);if(!m){f.querySelector('.rm').focus();return}const d=nd(f.querySelector('.rd').value);if(d===null||d===''){toast('تاریخ معتبر نیست؛ نمونه: 1405/01/01');return}
  D.sprac.push({id:rid(),sid:b.dataset.i,d,min:m,note:f.querySelector('.rt').value.trim()});open.add('k-'+b.dataset.i);touch('sprac');render()},
 jmood:b=>{const d=b.dataset.d,v=+b.dataset.v;let j=D.jour.find(x=>x.d===d);if(!j){j={id:rid(),d,mood:0,gr:'',lesson:'',txt:''};D.jour.push(j)}j.mood=j.mood===v?0:v;touch('jour');render()},
 jopen:b=>{F.jd=b.dataset.d;V='grow';GT='jour';render()},
 sessadd:()=>{const d=nd(gv('ns-d'));if(d===null||d===''){bad('ns-d');return}const k=gv('ns-k')||'think',t=gv('ns-t')||(SESK[k]+' '+jd(d));
  const s={id:rid(),t,d,place:'',kind:k,st:'plan',agenda:SESTPL[k]||'',notes:'',items:[],res:[]};D.sess.unshift(s);open.add('s-'+s.id);touch('sess');render()},
 resadd:b=>{const f=rf(b),t=f.querySelector('.rt').value.trim();if(!t){f.querySelector('.rt').focus();return}const d=nd(f.querySelector('.rd').value);if(d===null){toast('مهلت معتبر نیست؛ نمونه: 1405/01/01');return}
  const s=D.sess.find(x=>x.id===b.dataset.i);if(!s)return;s.res.push({id:rid(),t,due:d||'',st:'todo',tid:''});open.add('s-'+s.id);touch('sess');render()},
 res2task:b=>{const s=D.sess.find(x=>x.id===b.dataset.p),r=s&&s.res.find(x=>x.id===b.dataset.i);if(!r)return;const t={id:rid(),t:r.t,area:'personal',pid:'',due:r.due||'',prio:'mid',st:r.st==='done'?'done':'todo',desc:'مصوبهٔ جلسه: '+(s.t||'')};if(t.st==='done')t.doneAt=today();D.task.unshift(t);r.tid=t.id;open.add('s-'+s.id);touch('task','sess');toast('به تسک‌ها اضافه شد');render()},
 gosess:b=>{V='sess';F={};open.add('s-'+b.dataset.i);render();setTimeout(()=>{const n=document.querySelector('details[data-oid="s-'+b.dataset.i+'"]');if(n)n.scrollIntoView({block:'start'})},0)},
 bkopen:()=>{$('#bk-t').value=JSON.stringify(D,null,1);$('#bk-m').textContent='این متن همهٔ داده‌های شماست. کپی یا ذخیره‌اش کنید تا نسخهٔ پشتیبان داشته باشید. برای بازیابی، متن پشتیبان را اینجا بچسبانید یا فایل را انتخاب کنید.';$('#ov').classList.add('on');$('#bk-t').focus()},
 bkclose:()=>$('#ov').classList.remove('on'),
 bkcopy:()=>{const t=$('#bk-t');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('کپی شد'),()=>{document.execCommand('copy');toast('کپی شد')})}catch(e){try{document.execCommand('copy');toast('کپی شد')}catch(_){toast('کپی نشد؛ متن را دستی انتخاب کنید')}}},
 bkdl:async()=>{if(!dlApi)return;try{await dlApi.save({filename:'dafar-man-'+today().replace(/\//g,'-')+'.json',data:JSON.stringify(D,null,1)});toast('فایل ذخیره شد')}catch(e){if(!e||e.code!=='declined')toast('ذخیرهٔ فایل انجام نشد')}},
 bkload:b=>{
  if(b.dataset.armed!=='1'){b.dataset.armed='1';b._t=b.textContent;b.textContent='مطمئنید؟ داده‌های فعلی جایگزین می‌شود';setTimeout(()=>{if(b.isConnected){b.dataset.armed='';b.textContent=b._t}},4000);return}
  b.dataset.armed='';b.textContent=b._t;importJSON($('#bk-t').value)}
};
const SEL={
 refer:el=>{const s=D.sess.find(x=>x.id===el.value),kind=el.dataset.kind,id=el.dataset.i;if(!s)return;addItem(s,kind,id);open.add({goal:'g-',idea:'i-',proj:'p-'}[kind]+id);touch('sess');render()},
 sitem:el=>{const v=el.value;if(!v)return;const[k,ref]=v.split('|'),s=D.sess.find(x=>x.id===el.dataset.i);if(!s)return;addItem(s,k,ref);open.add('s-'+s.id);touch('sess');render()}
};
function addItem(s,kind,ref){if(s.items.some(x=>x.kind===kind&&x.ref===ref))return;s.items.push({id:rid(),kind,ref,verdict:'pending',vnote:''});if(kind==='idea'){const e=D.idea.find(x=>x.id===ref);if(e&&e.st==='new'){e.st='review';touch('idea')}}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b,e)});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('.nb');if(b)go(b.dataset.v)});
$('#bk-f').addEventListener('change',function(){const f=this.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bk-t').value=String(r.result||'');$('#bk-m').textContent='فایل خوانده شد. برای اعمال، «جایگزینی با این متن» را بزنید.'};r.readAsText(f)});
$('#ov').addEventListener('pointerdown',e=>{if(e.target===$('#ov'))$('#ov').classList.remove('on')});
function importJSON(s){
 try{const g=JSON.parse(s);if(!g||typeof g!=='object'||Array.isArray(g))throw 0;const d=blank();NAMES.forEach(n=>{if(Array.isArray(g[n]))d[n]=g[n]});if(g.set&&typeof g.set==='object')d.set=g.set;D=d;fixD();NAMES.forEach(n=>dirty.add(n));dirty.add('set');lsSave();persist();$('#ov').classList.remove('on');render();toast('داده‌ها بازیابی شد')}
 catch(e){$('#bk-m').textContent='این متن، پشتیبان معتبر نیست. متن کامل پشتیبان یا فایل .json را وارد کنید.'}}
function applyTheme(t){const r=document.documentElement;if(t)r.setAttribute('data-theme',t);else r.removeAttribute('data-theme')}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();else pull()});
window.addEventListener('pagehide',flush);

/* ================= شروع ================= */
function boot(){
 try{applyTheme(localStorage.getItem(TK)||'')}catch(e){}
 $('#nav').innerHTML=NAV.map(([k,l])=>`<button class="nb" data-v="${k}">${l}</button>`).join('');
 loadLocal();setStatus('local');render();initCloud();
}
if(window.__TEST){window.__TEST({boot,initCloud,touch,persist,VIEWS,GV,ACT,SEL,D:()=>D,setD:x=>{D=x},fixD,g2j,today,nd,jd,setV:v=>{V=v},setGT:v=>{GT=v},SUMS,fieldEvt,removeItem,chunks,finCalc,streak,lastDays,num,fmt})}
else boot();
})();
</script>
